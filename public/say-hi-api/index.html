<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Say hi API</title>
<link rel="stylesheet" href="./swagger-ui.css">
<style>
  :root { color-scheme: light; }
  body { margin: 0; background: #fafafa; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .topbar-custom {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 14px 24px; background: #1f2430; color: #f3f4f6;
  }
  .topbar-custom .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 16px; }
  .topbar-custom .brand .dot { width: 10px; height: 10px; border-radius: 50%; background: #ea4b71; }
  .topbar-custom .meta { font-size: 13px; color: #aab1bf; }
  .topbar-custom .meta code { color: #f3f4f6; background: #2c3342; padding: 2px 6px; border-radius: 4px; }
  .notice {
    max-width: 1460px; margin: 16px auto 0; padding: 10px 20px; box-sizing: border-box;
    font-size: 13px; color: #5b4a00; background: #fff6d6; border: 1px solid #f1dc8f; border-radius: 6px;
  }
  .notice code { background: rgba(0,0,0,.06); padding: 1px 5px; border-radius: 3px; }
  .swagger-ui .info { margin: 30px 0 20px; }
  .swagger-ui .scheme-container { box-shadow: none; border-bottom: 1px solid #eee; }
</style>
</head>
<body>

<div class="topbar-custom">
  <div class="brand"><span class="dot"></span>Say hi API</div>
  <div class="meta">n8n workflow <code>Say hi</code> &middot; <a href="openapi.yaml" style="color:#f3f4f6">openapi.yaml</a></div>
</div>


<div id="swagger-ui"></div>
<script src="./swagger-ui-bundle.js"></script>
<script>
  const spec = {"openapi": "3.0.3", "info": {"title": "Say hi API", "version": "1.0.0", "description": "Three webhook endpoints served by the n8n workflow **Say hi** on `n8n.yannklein.dev`.\n\n| Endpoint | What it does | Auth |\n|---|---|---|\n| `GET /hello` | Returns a greeting, personalised if you pass `name` | None |\n| `GET /greetings` | Returns a Le Wagon Barcelona team member's intro | None |\n| `POST /ask-yann` | An AI agent answers your question as Yann (max ~100 words) | `Authorization` header |\n\nUse the **production** server for the published workflow. The **test** server only answers while\nthe workflow editor is listening (\"Listen for test event\" in n8n).\n", "contact": {"name": "Yann Klein", "url": "https://yannklein.dev"}}, "servers": [{"url": "https://n8n.yannklein.dev/webhook", "description": "Production"}, {"url": "https://n8n.yannklein.dev/webhook-test", "description": "Test (editor must be listening)"}], "tags": [{"name": "Greeting", "description": "Public greeting endpoints"}, {"name": "AI", "description": "LLM-backed endpoint (protected)"}], "paths": {"/hello": {"get": {"tags": ["Greeting"], "operationId": "sayHello", "summary": "Get a greeting", "description": "Returns a one-item JSON array containing a greeting. If `name` is passed the greeting is\npersonalised, otherwise it falls back to `Hi there!`.\n\nThe array is wrapped this way so polling tools (e.g. Zapier \"New Item From API\") can\ndeduplicate on `id`.\n\n```bash\ncurl \"https://n8n.yannklein.dev/webhook/hello?name=Adriana\"\n```\n", "parameters": [{"name": "name", "in": "query", "required": false, "description": "Name of the person to greet.", "schema": {"type": "string", "example": "Adriana"}}], "responses": {"200": {"description": "Greeting returned", "content": {"application/json": {"schema": {"type": "array", "minItems": 1, "maxItems": 1, "items": {"$ref": "#/components/schemas/Greeting"}}, "examples": {"withName": {"summary": "With `?name=Adriana`", "value": [{"id": "1", "message": "Hi Adriana!"}]}, "withoutName": {"summary": "Without `name`", "value": [{"id": "1", "message": "Hi there!"}]}}}}}}}}, "/greetings": {"get": {"tags": ["Greeting"], "operationId": "getGreeting", "summary": "Get a team member's intro", "description": "Returns the self-introduction of one Le Wagon Barcelona team member.\nThe `person` value is trimmed and case-insensitive (`Yann`, `yann` and ` YANN ` all work).\n\nSome intros (Yann's) contain Markdown links and line breaks (`\\n`): render `greeting`\nas Markdown if you display it.\n\n```bash\ncurl \"https://n8n.yannklein.dev/webhook/greetings?person=berta\"\n```\n", "parameters": [{"name": "person", "in": "query", "required": true, "description": "Who to fetch the intro for.", "schema": {"type": "string", "enum": ["camila", "berta", "nico", "alyssa", "yann"], "example": "berta"}}], "responses": {"200": {"description": "Intro found", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/TeamGreeting"}, "examples": {"berta": {"summary": "?person=berta", "value": {"person": "berta", "name": "Berta", "greeting": "Hi, I'm Berta! I manage our community and the operations at Le Wagon Barcelona."}}, "yann": {"summary": "?person=yann (Markdown)", "value": {"person": "yann", "name": "Yann", "greeting": "Hi, I'm Yann! I'm a [maker](https://www.yannklein.dev/) at heart, passionate about building applications and exploring the edges of technology, VR, AR, and lately AI.\n(And yes, I may or may not have a [leathercraft addiction](https://medium.com/@yann.and.the.machines/yann-and-the-machines-50540e9ec088) 🙄)\nI'm also a people person: [changing the lives of coding bootcamp students](https://www.lewagon.com/blog/meet-our-team-yann) is what gets me out of bed every morning ❤️."}}}}}}, "400": {"description": "`person` is missing or empty", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/LookupError"}, "example": {"error": "Missing `person` query parameter", "available": ["camila", "berta", "nico", "alyssa", "yann"]}}}}, "404": {"description": "Nobody by that name", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/LookupError"}, "example": {"error": "Unknown person: bob", "available": ["camila", "berta", "nico", "alyssa", "yann"]}}}}}}}, "/ask-yann": {"post": {"tags": ["AI"], "operationId": "askYann", "summary": "Ask Yann a question", "description": "Sends the question to an n8n AI Agent (OpenAI-compatible chat model,\n`Ministral-3-3B-Instruct`) prompted with Yann's bio. The agent answers in the\nfirst person, as Yann, in 100 words or fewer.\n\nThe request must carry the shared secret as the **raw** value of the `Authorization`\nheader (no `Bearer ` prefix). Anything else gets a `401`.\n\nExpect a few seconds to ~20 s of latency: the response is returned in one piece once the\nmodel has finished (it is not streamed).\n\n```bash\ncurl -X POST \"https://n8n.yannklein.dev/webhook/ask-yann\" \\\n  -H \"Authorization: <secret>\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\"question\": \"Where did you study?\"}'\n```\n", "security": [{"sharedSecret": []}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AskYannRequest"}, "examples": {"studies": {"summary": "Education", "value": {"question": "Where did you study?"}}, "japan": {"summary": "Japan years", "value": {"question": "What did you do in Japan?"}}}}}}, "responses": {"200": {"description": "The agent's answer", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AskYannResponse"}, "example": {"output": "I did my engineering master's in IT at IMT Mines Albi in France, with an exchange semester in Chile, then an MS in Mechanical Engineering and Computer Science at Georgia Tech in Atlanta."}}}}, "401": {"description": "Missing or wrong `Authorization` header", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}, "example": {"error": "Authentication needed 🥲"}}}}, "500": {"description": "Workflow error (e.g. the model is unreachable)", "content": {"application/json": {"schema": {"type": "object", "properties": {"message": {"type": "string", "example": "Error in workflow"}}}}}}}}}}, "components": {"securitySchemes": {"sharedSecret": {"type": "apiKey", "in": "header", "name": "Authorization", "description": "Shared secret sent as the raw `Authorization` header value (no `Bearer` prefix)."}}, "schemas": {"Greeting": {"type": "object", "required": ["id", "message"], "properties": {"id": {"type": "string", "description": "Constant item id (always `\"1\"`).", "example": "1"}, "message": {"type": "string", "example": "Hi Adriana!"}}}, "TeamGreeting": {"type": "object", "required": ["person", "name", "greeting"], "properties": {"person": {"type": "string", "description": "Normalised key that was looked up.", "example": "berta"}, "name": {"type": "string", "example": "Berta"}, "greeting": {"type": "string", "format": "markdown", "description": "The person's intro. May contain Markdown links and `\\n` line breaks."}}}, "LookupError": {"type": "object", "required": ["error", "available"], "properties": {"error": {"type": "string"}, "available": {"type": "array", "description": "Valid `person` values.", "items": {"type": "string"}}}}, "AskYannRequest": {"type": "object", "required": ["question"], "properties": {"question": {"type": "string", "description": "The question to put to \"Yann\".", "example": "Where did you study?"}}}, "AskYannResponse": {"type": "object", "required": ["output"], "properties": {"output": {"type": "string", "description": "The agent's answer, written as Yann, 100 words or fewer."}}}, "Error": {"type": "object", "required": ["error"], "properties": {"error": {"type": "string"}}}}}};
  window.ui = SwaggerUIBundle({
    spec,
    dom_id: "#swagger-ui",
    deepLinking: false,
    docExpansion: "list",
    defaultModelsExpandDepth: 1,
    defaultModelExpandDepth: 2,
    displayRequestDuration: true,
    tryItOutEnabled: true,
    supportedSubmitMethods: ["get","post"],
    persistAuthorization: false,
    presets: [SwaggerUIBundle.presets.apis],
    layout: "BaseLayout"
  });
</script>
</body>
</html>
